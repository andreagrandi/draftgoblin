[project]
name = "draftgoblin"
version = "0.2.0"
description = "An unofficial Quick Draft assistant for MTG Arena"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Andrea Grandi" }]
keywords = [
    "draft",
    "magic-the-gathering",
    "mtg-arena",
    "terminal",
    "tui",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "textual>=8.2.8",
    "textual-image>=0.13.2",
]

[project.optional-dependencies]
gui = [
    "pyside6>=6.9,<7",
]

[project.urls]
Homepage = "https://github.com/andreagrandi/draftgoblin"
Repository = "https://github.com/andreagrandi/draftgoblin"
Issues = "https://github.com/andreagrandi/draftgoblin/issues"

[project.scripts]
draftgoblin = "draftgoblin.cli:main"
draftgoblin-gui-mockup = "draftgoblin.qt_mock:main"

[project.gui-scripts]
draftgoblin-gui = "draftgoblin.qt_gui:main"

[dependency-groups]
dev = [
    "nox>=2026.4.10",
    "pytest>=8.4.0",
]

[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["draftgoblin*"]
[tool.setuptools.package-data]
draftgoblin = [
    "assets/*.icns",
    "assets/*.ico",
    "assets/*.png",
    "qml/*.qml",
    "qml/qmldir",
]
[tool.pyside6-project]
# Keep the deployment project input explicit: Python sources, QML module files,
# and the logo used by NavigationRail.qml. No fonts are bundled.
files = [
    "draftgoblin/__init__.py",
    "draftgoblin/audit.py",
    "draftgoblin/backtest.py",
    "draftgoblin/benchmark.py",
    "draftgoblin/carddb.py",
    "draftgoblin/cardimages.py",
    "draftgoblin/cli.py",
    "draftgoblin/config.py",
    "draftgoblin/deckbuilder.py",
    "draftgoblin/events.py",
    "draftgoblin/logfollow.py",
    "draftgoblin/mock_session.py",
    "draftgoblin/paths.py",
    "draftgoblin/pickengine.py",
    "draftgoblin/pool.py",
    "draftgoblin/preferences.py",
    "draftgoblin/qt_adapter.py",
    "draftgoblin/qt_gui.py",
    "draftgoblin/qt_mock.py",
    "draftgoblin/ranking.py",
    "draftgoblin/replay.py",
    "draftgoblin/session.py",
    "draftgoblin/setinfo.py",
    "draftgoblin/seventeen.py",
    "draftgoblin/splash.py",
    "draftgoblin/tui.py",
    "draftgoblin/watch.py",
    "draftgoblin/qml/AppBar.qml",
    "draftgoblin/qml/BacktestView.qml",
    "draftgoblin/qml/BuildView.qml",
    "draftgoblin/qml/CardPreview.qml",
    "draftgoblin/qml/LiveDraftView.qml",
    "draftgoblin/qml/RecentPickThumbnail.qml",
    "draftgoblin/qml/RecentPicksGallery.qml",
    "draftgoblin/qml/Main.qml",
    "draftgoblin/qml/NavigationRail.qml",
    "draftgoblin/qml/PoolSummaryPanel.qml",
    "draftgoblin/qml/RecommendationRow.qml",
    "draftgoblin/qml/SettingsView.qml",
    "draftgoblin/qml/StateBanner.qml",
    "draftgoblin/qml/StatusStrip.qml",
    "draftgoblin/qml/Theme.qml",
    "draftgoblin/qml/qmldir",
    "draftgoblin/assets/draftgoblin.icns",
    "draftgoblin/assets/draftgoblin.ico",
    "draftgoblin/assets/draftgoblin_logo.png",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
