[project]
name = "draftgoblin"
version = "0.1.0"
description = "An unofficial Quick Draft assistant for MTG Arena"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Andrea Grandi" }]
dependencies = [
    "textual>=8.2.8",
    "textual-image>=0.13.2",
]

[project.scripts]
draftgoblin = "draftgoblin.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4.0",
]

[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["draftgoblin*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
