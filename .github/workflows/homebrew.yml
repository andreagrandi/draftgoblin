name: Publish Homebrew formula

on:
  workflow_call:
    inputs:
      version:
        description: PyPI version, with or without a leading v
        required: true
        type: string
    secrets:
      HOMEBREW_TAP_DEPLOY_KEY:
        description: Write-enabled SSH deploy key for the Homebrew tap
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: Existing PyPI version to publish to Homebrew
        required: true
        type: string

permissions:
  contents: read

jobs:
  homebrew:
    name: Update and test Homebrew formula
    runs-on: macos-latest
    steps:
      - name: Check out Draftgoblin
        uses: actions/checkout@v7

      - name: Require Homebrew tap deploy key
        env:
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: test -n "${HOMEBREW_TAP_DEPLOY_KEY}"

      - name: Check out Homebrew tap
        uses: actions/checkout@v7
        with:
          repository: andreagrandi/homebrew-tap
          path: homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}

      - name: Register checked-out Homebrew tap
        run: |
          brew tap --custom-remote \
            andreagrandi/tap \
            "file://${GITHUB_WORKSPACE}/homebrew-tap"
          echo "HOMEBREW_TAP_PATH=$(brew --repository andreagrandi/tap)" >> "${GITHUB_ENV}"

      - name: Render formula from published release
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python3 scripts/render_homebrew_formula.py \
            --version "${RELEASE_VERSION#v}" \
            --template .github/homebrew/draftgoblin.rb.in \
            --output "${HOMEBREW_TAP_PATH}/Formula/draftgoblin.rb"

      - name: Pin Python resources
        run: |
          brew update-python-resources \
            --ignore-main-package-cooldown \
            --install-dependencies \
            andreagrandi/tap/draftgoblin

      - name: Check formula style and metadata
        run: |
          brew style --formula andreagrandi/tap/draftgoblin
          brew audit --strict andreagrandi/tap/draftgoblin

      - name: Install and test formula
        run: |
          brew install --build-from-source andreagrandi/tap/draftgoblin
          brew test andreagrandi/tap/draftgoblin

      - name: Copy validated formula to tap checkout
        run: |
          cp \
            "${HOMEBREW_TAP_PATH}/Formula/draftgoblin.rb" \
            homebrew-tap/Formula/draftgoblin.rb

      - name: Publish formula to tap
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        working-directory: homebrew-tap
        run: |
          formula_version="${RELEASE_VERSION#v}"
          git config user.name "goreleaserbot"
          git config user.email "goreleaser@github.com"
          git add Formula/draftgoblin.rb
          if git diff --cached --quiet; then
            echo "Formula already matches this release."
            exit 0
          fi
          git commit -m "Brew formula update for draftgoblin version v${formula_version}"
          git push origin HEAD:master
