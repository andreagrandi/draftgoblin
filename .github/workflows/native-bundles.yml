name: Build native desktop bundles

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  # The native smoke helper launches the compiled app, not source Python.
  # Offscreen keeps the mock inspection deterministic on hosted runners.
  QT_QPA_PLATFORM: offscreen

jobs:
  native-bundle:
    name: Build unsigned ${{ matrix.platform }} development bundle
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
            config: pysidedeploy.macos.spec
            bundle: Draftgoblin-unsigned-macos.app
            artifact: Draftgoblin-unsigned-macos.tar
            artifact_name: draftgoblin-macos-unsigned-development
          - os: windows-latest
            platform: windows
            config: pysidedeploy.windows.spec
            bundle: Draftgoblin-unsigned-windows.exe
            artifact: Draftgoblin-unsigned-windows.exe
            artifact_name: draftgoblin-windows-unsigned-development
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync GUI dependencies
        run: uv sync --locked --extra gui

      - name: Install pinned Nuitka deployment dependency
        run: uv pip install "Nuitka==4.1.3"

      - name: Build unsigned bundle
        run: uv run pyside6-deploy --config-file "${{ matrix.config }}" --force

      - name: Archive macOS unsigned development bundle
        if: matrix.platform == 'macos'
        run: >-
          tar -cf
          "dist-native/macos-unsigned/${{ matrix.artifact }}"
          -C "dist-native/macos-unsigned"
          "${{ matrix.bundle }}"

      - name: Smoke-test extracted macOS bundle with deterministic mock data
        if: matrix.platform == 'macos'
        run: |
          set -euo pipefail
          extracted_bundle="$RUNNER_TEMP/draftgoblin-macos-bundle"
          rm -rf "$extracted_bundle"
          mkdir -p "$extracted_bundle"
          tar -xpf \
            "dist-native/macos-unsigned/${{ matrix.artifact }}" \
            -C "$extracted_bundle"
          uv run python tests/bundle_smoke.py \
            "$extracted_bundle/${{ matrix.bundle }}"

      - name: Smoke-test Windows executable with deterministic mock data
        if: matrix.platform == 'windows'
        run: >-
          uv run python tests/bundle_smoke.py
          "dist-native/windows-unsigned/${{ matrix.bundle }}"

      - name: Upload unsigned development artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: dist-native/${{ matrix.platform }}-unsigned/${{ matrix.artifact }}
          if-no-files-found: error
          overwrite: true
