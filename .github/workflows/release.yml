name: Publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build and validate distributions
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked

      - name: Check tag matches package version
        shell: bash
        run: |
          package_version="$(uv version --short)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "${tag_version}" != "${package_version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${package_version}."
            exit 1
          fi

      - name: Run checks
        run: uv run nox -s ci

      - name: Build distributions
        run: uv build --no-sources

      - name: Check distribution metadata
        run: uvx --from twine twine check dist/*

      - name: Smoke-test wheel
        run: uv run --no-project --python 3.12 python tests/package_smoke.py "dist/*.whl"

      - name: Smoke-test source distribution
        run: uv run --no-project --python 3.12 python tests/package_smoke.py "dist/*.tar.gz"

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  platform-smoke:
    name: Smoke-test wheel on ${{ matrix.os }}
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - macos-latest
          - windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Smoke-test wheel
        run: uv run --no-project --python 3.12 python tests/package_smoke.py "dist/*.whl"

  publish:
    name: Publish distributions
    needs:
      - build
      - platform-smoke
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/draftgoblin
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always dist/*

  homebrew:
    needs: publish
    uses: ./.github/workflows/homebrew.yml
    with:
      version: ${{ github.ref_name }}
    secrets: inherit
