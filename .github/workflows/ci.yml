name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest

      - name: Run replay fixture regression
        run: |
          for logfile in tests/fixtures/*-player.log; do
            name="$(basename "$logfile" .log)"
            output="$RUNNER_TEMP/$name.replay.txt"
            golden="tests/golden/$name.replay.txt"
            uv run draftgoblin replay "$logfile" \
              --bulk-file tests/fixtures/scryfall-default-cards-sample.jsonl \
              > "$output"
            diff -u "$golden" "$output"
          done

      - name: Smoke-test CLI version
        run: uv run draftgoblin --version
